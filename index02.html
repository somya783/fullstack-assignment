<!-- 2. Ten Horizontal Cards -->
<!doctype html>
<html>
  <head>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial;
        margin: 20px;
      }
      .cards {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        padding: 10px;
      }
      .card {
        flex: 0 0 190px;
        border: 1px solid #ddd;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 8px #0002;
      }
      .card img {
        width: 100%;
        height: 120px;
        object-fit: cover;
      }
      .card h3,
      .card p {
        margin: 10px;
      }
      .card p {
        color: #555;
      }
    </style>
  </head>
  <body>
    <h2>Our Cards</h2>
    <div class="cards" id="cards"></div>
    <script>
      const cards = document.getElementById("cards");
      for (let i = 1; i <= 10; i++) {
        cards.innerHTML += `<article class="card">
  <img src="https://picsum.photos/seed/${i}/300/180" alt="Card ${i}">
  <h3>Card Title ${i}</h3><p>This is a short description for card ${i}.</p>
  </article>`;
      }
    </script>
  </body>
</html>
