// <!-- 8. Express Application with Five Routes and a Template Engine -->

<!DOCTYPE html><html><body><h1><%= title %></h1>
<p>Welcome to the Express and EJS application.</p>
<script>
    const express=require('express');
const app=express();
app.set('view engine','ejs');
app.use(express.urlencoded({extended:true}));
app.use(express.json());
 
app.get('/',(req,res)=>res.render('home',{title:'Home'}));       // 1
app.get('/about',(req,res)=>res.send('About page'));             // 2
app.get('/contact',(req,res)=>res.send('Contact page'));         // 3
app.get('/users',(req,res)=>res.json([{id:1,name:'Amit'}]));     // 4
app.post('/users',(req,res)=>res.status(201).json(req.body));    // 5
 
app.listen(3000,()=>console.log('http://localhost:3000'));
</script>
</body></html>
