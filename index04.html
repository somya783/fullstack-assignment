<!-- Chessboard UI Created Dynamically with JavaScript -->
<!doctype html>
<html>
  <head>
    <style>
      #board {
        display: grid;
        grid-template-columns: repeat(8, 55px);
        width: 440px;
      }
      .square {
        height: 55px;
        display: grid;
        place-items: center;
        font-size: 32px;
      }
      .light {
        background: #f0d9b5;
      }
      .dark {
        background: #b58863;
      }
    </style>
  </head>
  <body>
    <h2>Chessboard</h2>
    <div id="board"></div>
    <script>
      const board = document.getElementById("board");
      const pieces = [
        ["♜", "♞", "♝", "♛", "♚", "♝", "♞", "♜"],
        Array(8).fill("♟"),
        Array(8).fill(""),
        Array(8).fill(""),
        Array(8).fill(""),
        Array(8).fill(""),
        Array(8).fill("♙"),
        ["♖", "♘", "♗", "♕", "♔", "♗", "♘", "♖"],
      ];
      for (let r = 0; r < 8; r++)
        for (let c = 0; c < 8; c++) {
          const cell = document.createElement("div");
          cell.className = "square " + ((r + c) % 2 ? "dark" : "light");
          cell.textContent = pieces[r][c];
          board.appendChild(cell);
        }
    </script>
  </body>
</html>
